name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # 只跑 tests/unit：不使用任何 secrets、不連 OpenAI / Supabase / Neo4j / LINE
      - name: Unit tests
        run: python -m pytest tests/unit --basetemp=.pytest_ci
